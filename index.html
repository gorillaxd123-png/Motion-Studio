<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ANIMA OS — Billing</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a; color: #f0f0f0;
    }
    .card {
      max-width: 380px; text-align: center; padding: 40px 28px;
      background: #16161a; border: 1px solid #2a2a30; border-radius: 16px;
    }
    .logo {
      width: 48px; height: 48px; margin: 0 auto 18px; border-radius: 12px;
      background: #4a90d9; color: #fff; font-weight: 800; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #a0a0aa; margin: 0; }
    .ok .logo { background: #22a06b; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">A</div>
    <h1 id="title">Finishing up…</h1>
    <p id="msg">One moment.</p>
  </div>
  <script>
    // The subscription activates via PayPal's webhook, not this page — so this
    // just reassures the user and tells them to head back to the app, where the
    // plan unlocks automatically.
    var status = new URLSearchParams(location.search).get("status");
    var card = document.getElementById("card");
    var title = document.getElementById("title");
    var msg = document.getElementById("msg");
    if (status === "cancel") {
      title.textContent = "Checkout cancelled";
      msg.textContent = "No charge was made. You can return to ANIMA OS and try again anytime.";
    } else {
      card.className = "card ok";
      title.textContent = "Payment received — thank you!";
      msg.textContent = "Your plan unlocks in ANIMA OS automatically within a few seconds. You can close this tab and return to the app.";
    }
  </script>
</body>
</html>
