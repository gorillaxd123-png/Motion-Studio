<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Studio — Grid Zoom Strip</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      --accent: #0071e3;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .app-container {
      width: 100%;
      max-width: 960px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    /* Upload Grid */
    .upload-section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
    }

    .upload-slot {
      aspect-ratio: 1;
      border: 2px dashed rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      background: rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }

    .upload-slot:hover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.8);
    }

    .upload-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-slot span {
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* Stage Canvas */
    .viewport-stage {
      width: 100%;
      height: 340px;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-strip-canvas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 240px;
      height: 240px;
      transition: transform 0.1s linear;
      transform-origin: center center;
    }

    .grid-cell {
      background: #f0f0f2;
      border-radius: 6px;
      overflow: hidden;
    }

    .grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px 20px;
      border-radius: 980px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }

    select {
      padding: 10px 14px;
      border-radius: 980px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Progress Overlay */
    .render-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 100;
    }

    .progress-bar-wrap {
      width: 260px;
      height: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 16px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>

  <header>
    <h1>Motion Studio</h1>
    <p>Grid Zoom Strip Template</p>
  </header>

  <div class="app-container">
    <div class="upload-section">
      <div class="section-title">Media Slots (Up to 9 Images)</div>
      <div class="upload-grid" id="uploadGrid"></div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <div class="viewport-stage">
      <div class="grid-strip-canvas" id="canvasGrid"></div>
    </div>

    <div class="controls-bar">
      <div class="btn-group">
        <button class="btn-secondary" id="playBtn">Play Animation</button>
      </div>

      <div class="btn-group">
        <select id="resSelect">
          <option value="1080p">1080p (Full HD)</option>
          <option value="4K">4K (Ultra HD)</option>
        </select>
        <button class="btn-primary" id="renderBtn">Render Video</button>
      </div>
    </div>
  </div>

  <div class="render-modal" id="renderModal">
    <h3 id="renderStatus">Rendering 1080p Motion...</h3>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    const MAX_SLOTS = 9;
    const uploadGrid = document.getElementById('uploadGrid');
    const canvasGrid = document.getElementById('canvasGrid');
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const renderBtn = document.getElementById('renderBtn');
    const renderModal = document.getElementById('renderModal');
    const progressBar = document.getElementById('progressBar');
    const renderStatus = document.getElementById('renderStatus');

    let images = new Array(MAX_SLOTS).fill(null);
    let isPlaying = false;
    let animFrame = null;
    let scale = 1;
    let growing = true;

    // Initialize Slots
    function initUI() {
      uploadGrid.innerHTML = '';
      canvasGrid.innerHTML = '';

      for (let i = 0; i < MAX_SLOTS; i++) {
        // Upload Slot
        const slot = document.createElement('div');
        slot.className = 'upload-slot';
        slot.innerHTML = images[i] ? `<img src="${images[i]}">` : `<span>+</span>`;
        slot.addEventListener('click', () => { fileInput.click(); });
        uploadGrid.appendChild(slot);

        // Canvas Cell
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        if (images[i]) cell.innerHTML = `<img src="${images[i]}">`;
        canvasGrid.appendChild(cell);
      }
    }

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files).slice(0, MAX_SLOTS);
      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          images[idx] = evt.target.result;
          initUI();
        };
        reader.readAsDataURL(file);
      });
    });

    // Zoom Animation Logic
    function animateGrid() {
      if (!isPlaying) return;

      if (growing) {
        scale += 0.008;
        if (scale >= 1.6) growing = false;
      } else {
        scale -= 0.008;
        if (scale <= 1.0) growing = true;
      }

      canvasGrid.style.transform = `scale(${scale})`;
      animFrame = requestAnimationFrame(animateGrid);
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.innerText = 'Pause';
        animateGrid();
      } else {
        playBtn.innerText = 'Play Animation';
        cancelAnimationFrame(animFrame);
      }
    });

    // Mock 4K/1080p Render Simulator
    renderBtn.addEventListener('click', () => {
      const res = document.getElementById('resSelect').value;
      renderStatus.innerText = `Rendering in ${res}...`;
      renderModal.style.display = 'flex';
      let progress = 0;

      const interval = setInterval(() => {
        progress += 4;
        progressBar.style.width = `${progress}%`;

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            renderModal.style.display = 'none';
            progressBar.style.width = '0%';
            alert(`Render Complete! High-quality ${res} output exported.`);
          }, 300);
        }
      }, 50);
    });

    initUI();
  </script>
</body>
</html>
