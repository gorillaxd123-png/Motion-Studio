<!-- Background & Media Controls Container -->
<div class="render-background-section">
  <!-- Preset Selector -->
  <div class="control-group">
    <label for="preset-select">Animation Preset:</label>
    <select id="preset-select" onchange="handlePresetChange(this.value)">
      <option value="ken-burns">1. Ken Burns Pan & Zoom (1 Slot)</option>
      <option value="parallax-3d">2. 3D Parallax Tilt (2 Slots)</option>
      <option value="diagonal-split">3. Diagonal Split Slide (2 Slots)</option>
      <option value="tri-panel">4. Tri-Panel Staggered Wave (3 Slots)</option>
      <option value="carousel-3d">5. Rotating 3D Cube Carousel (4 Slots)</option>
      <option value="cyber-glitch">6. Cyberpunk Chromatic Glitch (2 Slots)</option>
      <option value="floating-stack">7. Floating Card Stack (3 Slots)</option>

      <option value="kinetic-pulse">8. Kinetic Zoom Pulse (1 Slot)</option>
      <option value="filmstrip-roll">9. Vertical Filmstrip Loop (4 Slots)</option>
      <option value="radial-portal">10. Circular Portal Expansion (2 Slots)</option>
      <option value="glass-overlay">11. Glassmorphic Multi-Pane (3 Slots)</option>
      <option value="vortex-spin">12. Vortex Spiral Focus (3 Slots)</option>
      <option value="origami-flip">13. Origami 3D Flip (2 Slots)</option>
      <option value="elastic-grid">14. Elastic Bounce 2x2 Grid (4 Slots)</option>
      <option value="cinematic-reel">15. Pan Horizontal Reel (5 Slots)</option>
    </select>
  </div>

  <!-- Animated Viewport Display -->
  <div id="bg-viewport" class="bg-viewport preset-ken-burns">
    <div id="bg-content-container" class="bg-content-container"></div>
  </div>

  <!-- Dynamic Media Section -->
  <div class="media-section">
    <div class="media-header">
      <label>Media Slots (<span id="slot-counter">0 / 1</span>):</label>
      <small id="slot-info">Select up to 1 image for this preset.</small>
    </div>

    <!-- Drop/Upload Area -->
    <div class="media-upload-wrapper">
      <input type="file" id="media-input" accept="image/*" multiple onchange="handleImageUpload(event)" />
      <button class="upload-btn" onclick="document.getElementById('media-input').click()">
        + Add Images
      </button>
    </div>

    <!-- Image Thumbnails Grid -->
    <div id="media-grid" class="media-grid"></div>
  </div>
</div>

<style>
/* Viewport & Layout */
.render-background-section { display: flex; flex-direction: column; gap: 16px; font-family: sans-serif; }
.bg-viewport {
  width: 100%; height: 280px; border-radius: 12px; overflow: hidden;
  position: relative; background: #0d0f12; perspective: 1000px;
}
.bg-content-container { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }

/* Media Section & Thumbnails */
.media-section { background: #161920; padding: 16px; border-radius: 10px; color: #fff; }
.media-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.media-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

.media-thumb-wrapper {
  position: relative; width: 80px; height: 80px; border-radius: 8px;
  overflow: hidden; border: 2px solid #2e3440;
}
.media-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }

/* Cross Overlay on Hover */
.media-thumb-wrapper .remove-btn {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(220, 38, 38, 0.85); color: #fff; display: flex;
  align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
  opacity: 0; cursor: pointer; transition: opacity 0.2s ease-in-out; border: none;
}
.media-thumb-wrapper:hover .remove-btn { opacity: 1; }

/* --- 15 ANIMATION PRESETS CSS --- */
/* Preset 1: Ken Burns */
.preset-ken-burns img { width: 100%; height: 100%; object-fit: cover; animation: kenBurns 12s infinite alternate ease-in-out; }
@keyframes kenBurns { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.25) translate(-3%, -2%); } }

/* Preset 2: Parallax 3D Tilt */
.preset-parallax-3d { display: flex; gap: 8px; padding: 12px; }
.preset-parallax-3d img:nth-child(1) { width: 60%; height: 100%; object-fit: cover; animation: tiltLeft 6s infinite alternate ease-in-out; }
.preset-parallax-3d img:nth-child(2) { width: 40%; height: 100%; object-fit: cover; animation: tiltRight 6s infinite alternate ease-in-out; }
@keyframes tiltLeft { 0% { transform: rotateY(-15deg) scale(0.95); } 100% { transform: rotateY(5deg) scale(1.05); } }
@keyframes tiltRight { 0% { transform: rotateY(15deg) scale(1.05); } 100% { transform: rotateY(-5deg) scale(0.95); } }

/* Preset 3: Diagonal Split Slide */
.preset-diagonal-split img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.preset-diagonal-split img:nth-child(1) { clip-path: polygon(0 0, 100% 0, 0 100%); animation: diagSlide1 5s infinite alternate; }
.preset-diagonal-split img:nth-child(2) { clip-path: polygon(100% 0, 100% 100%, 0 100%); animation: diagSlide2 5s infinite alternate; }
@keyframes diagSlide1 { 0% { transform: translate(-10px, -10px); } 100% { transform: translate(10px, 10px); } }
@keyframes diagSlide2 { 0% { transform: translate(10px, 10px); } 100% { transform: translate(-10px, -10px); } }

/* Preset 4: Tri-Panel Staggered Wave */
.preset-tri-panel { display: flex; width: 100%; height: 100%; }
.preset-tri-panel img { width: 33.33%; height: 100%; object-fit: cover; animation: waveUp 4s infinite alternate ease-in-out; }
.preset-tri-panel img:nth-child(2) { animation-delay: 0.5s; }
.preset-tri-panel img:nth-child(3) { animation-delay: 1s; }
@keyframes waveUp { 0% { transform: translateY(-8%); } 100% { transform: translateY(8%); } }

/* Preset 5: 3D Cube Carousel */
.preset-carousel-3d { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.preset-carousel-3d .cube { width: 180px; height: 180px; position: relative; transform-style: preserve-3d; animation: rotateCube 10s infinite linear; }
.preset-carousel-3d .cube img { position: absolute; width: 180px; height: 180px; object-fit: cover; opacity: 0.9; }
.preset-carousel-3d .cube img:nth-child(1) { transform: rotateY(0deg) translateZ(90px); }
.preset-carousel-3d .cube img:nth-child(2) { transform: rotateY(90deg) translateZ(90px); }
.preset-carousel-3d .cube img:nth-child(3) { transform: rotateY(180deg) translateZ(90px); }
.preset-carousel-3d .cube img:nth-child(4) { transform: rotateY(-90deg) translateZ(90px); }
@keyframes rotateCube { from { transform: rotateY(0deg) rotateX(10deg); } to { transform: rotateY(360deg) rotateX(10deg); } }

/* Preset 6: Cyber Glitch */
.preset-cyber-glitch img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.preset-cyber-glitch img:nth-child(1) { animation: glitchA 2s infinite linear; }
.preset-cyber-glitch img:nth-child(2) { opacity: 0.5; mix-blend-mode: hard-light; animation: glitchB 2s infinite linear; }
@keyframes glitchA { 0%, 100% { transform: translate(0); } 20% { transform: translate(-5px, 3px); } 80% { transform: translate(5px, -3px); } }
@keyframes glitchB { 0%, 100% { transform: translate(0); } 30% { transform: translate(6px, -2px); } 70% { transform: translate(-4px, 4px); } }

/* Preset 7: Floating Stack */
.preset-floating-stack { display: flex; align-items: center; justify-content: center; height: 100%; }
.preset-floating-stack img { position: absolute; width: 160px; height: 200px; border-radius: 8px; object-fit: cover; animation: floatStack 6s infinite ease-in-out alternate; }
.preset-floating-stack img:nth-child(1) { transform: translateX(-60px) rotate(-8deg); animation-delay: 0s; }
.preset-floating-stack img:nth-child(2) { transform: translateX(0px) rotate(0deg); z-index: 2; animation-delay: 1s; }
.preset-floating-stack img:nth-child(3) { transform: translateX(60px) rotate(8deg); animation-delay: 2s; }
@keyframes floatStack { 0% { translateY: -10px; } 100% { translateY: 10px; } }

/* Preset 8: Kinetic Pulse */
.preset-kinetic-pulse img { width: 100%; height: 100%; object-fit: cover; animation: pulseScale 3s infinite ease-in-out; }
@keyframes pulseScale { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.15) rotate(2deg); } }

/* Preset 9: Filmstrip Roll */
.preset-filmstrip-roll { display: flex; flex-direction: column; animation: rollUp 8s infinite linear; }
.preset-filmstrip-roll img { width: 100%; height: 140px; object-fit: cover; flex-shrink: 0; margin-bottom: 8px; }
@keyframes rollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-300px); } }

/* Preset 10: Radial Portal */
.preset-radial-portal img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.preset-radial-portal img:nth-child(2) { clip-path: circle(30% at 50% 50%); animation: portalExpand 4s infinite alternate ease-in-out; }
@keyframes portalExpand { 0% { clip-path: circle(15% at 50% 50%); } 100% { clip-path: circle(60% at 50% 50%); } }

/* Preset 11: Glassmorphic Overlay */
.preset-glass-overlay { display: flex; position: relative; width: 100%; height: 100%; }
.preset-glass-overlay img { width: 33.33%; height: 100%; object-fit: cover; backdrop-filter: blur(4px); animation: glassShift 5s infinite alternate ease-in-out; }
@keyframes glassShift { 0% { filter: blur(0px) brightness(1); } 100% { filter: blur(4px) brightness(1.2); } }

/* Preset 12: Vortex Spin */
.preset-vortex-spin img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; animation: vortex 8s infinite linear; }
.preset-vortex-spin img:nth-child(2) { animation-direction: reverse; animation-duration: 6s; }
.preset-vortex-spin img:nth-child(3) { animation-duration: 12s; opacity: 1; scale: 0.6; }
@keyframes vortex { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1.2); } }

/* Preset 13: Origami Flip */
.preset-origami-flip { display: flex; width: 100%; height: 100%; perspective: 600px; }
.preset-origami-flip img { width: 50%; height: 100%; object-fit: cover; animation: flip3D 4s infinite alternate ease-in-out; }
@keyframes flip3D { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(180deg); } }

/* Preset 14: Elastic Grid */
.preset-elastic-grid { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; gap: 4px; }
.preset-elastic-grid img { width: 100%; height: 100%; object-fit: cover; animation: elasticPop 3s infinite alternate ease-in-out; }
@keyframes elasticPop { 0% { transform: scale(0.9); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

/* Preset 15: Pan Reel */
.preset-cinematic-reel { display: flex; width: 250%; height: 100%; animation: reelPan 12s infinite linear; }
.preset-cinematic-reel img { width: 20%; height: 100%; object-fit: cover; }
@keyframes reelPan { 0% { transform: translateX(0); } 100% { transform: translateX(-60%); } }
</style>
