<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #2f2f2f; /* smooth grey background */
      color: #fff;
      display: flex;
      height: 100vh;
    }

    /* Sidebar for categories */
    .sidebar {
      width: 20%;
      background: #3a3a3a;
      padding: 20px;
      box-sizing: border-box;
    }
    .sidebar h2 {
      margin-top: 0;
      font-size: 1.2em;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar ul li {
      margin: 10px 0;
      cursor: pointer;
      transition: color 0.3s;
    }
    .sidebar ul li:hover {
      color: #00bcd4;
    }

    /* Preview section */
    .preview {
      width: 50%;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .preview h1 {
      margin-top: 0;
      font-size: 2em;
    }
    .preview-box {
      background: #444;
      height: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    /* Media section */
    .media {
      width: 30%;
      background: #3a3a3a;
      padding: 20px;
      box-sizing: border-box;
    }
    .media h2 {
      margin-top: 0;
      font-size: 1.2em;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }
    .media-item {
      background: #444;
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Categories Sidebar -->
  <div class="sidebar">
    <h2>Categories</h2>
    <ul>
      <li>Intro Animations</li>
      <li>Transitions</li>
      <li>Lower Thirds</li>
      <li>End Screens</li>
    </ul>
  </div>

  <!-- Preview Section -->
  <div class="preview">
    <h1>Motion Studio</h1>
    <div class="preview-box">
      <p>Preview Area</p>
    </div>
  </div>

  <!-- Media Section -->
  <div class="media">
    <h2>Media</h2>
    <div class="media-item">Sample Animation 1</div>
    <div class="media-item">Sample Animation 2</div>
    <div class="media-item">Sample Animation 3</div>
  </div>
</body>
</html>
