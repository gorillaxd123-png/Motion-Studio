<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #2f2f2f;
      color: #fff;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 20%;
      background: #3a3a3a;
      padding: 20px;
      box-sizing: border-box;
    }
    .sidebar h2 { margin-top: 0; }

    .preview {
      width: 50%;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .preview h1 { margin-top: 0; }

    /* Carousel container */
    .carousel {
      display: flex;
      overflow: hidden;
      position: relative;
      height: 300px;
      border-radius: 12px;
      background: #444;
    }

    .carousel-track {
      display: flex;
      animation: scroll 12s linear infinite;
    }

    .carousel img {
      width: 200px;
      height: 300px;
      margin-right: 10px;
      border-radius: 12px;
      filter: blur(0.5px); /* subtle motion blur */
      transition: transform 0.3s;
    }

    .carousel img:hover {
      transform: scale(1.05);
      filter: blur(0); /* sharpen on hover */
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .media {
      width: 30%;
      background: #3a3a3a;
      padding: 20px;
      box-sizing: border-box;
    }
    .media h2 { margin-top: 0; }
    .media-item { margin: 10px 0; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Categories</h2>
    <ul>
      <li>Intro Animations</li>
      <li>Transitions</li>
      <li>Lower Thirds</li>
      <li>End Screens</li>
    </ul>
  </div>

  <div class="preview">
    <h1>Motion Studio</h1>
    <div class="carousel">
      <div class="carousel-track">
        <!-- Six thumbnails -->
        <img src="thumb1.jpg" alt="Thumbnail 1">
        <img src="thumb2.jpg" alt="Thumbnail 2">
        <img src="thumb3.jpg" alt="Thumbnail 3">
        <img src="thumb4.jpg" alt="Thumbnail 4">
        <img src="thumb5.jpg" alt="Thumbnail 5">
        <img src="thumb6.jpg" alt="Thumbnail 6">
      </div>
    </div>
  </div>

  <div class="media">
    <h2>Media</h2>
    <div class="media-item">Thumbnail 1</div>
    <div class="media-item">Thumbnail 2</div>
    <div class="media-item">Thumbnail 3</div>
    <div class="media-item">Thumbnail 4</div>
    <div class="media-item">Thumbnail 5</div>
    <div class="media-item">Thumbnail 6</div>
  </div>
</body>
</html>
